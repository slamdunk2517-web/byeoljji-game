<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>별찌의 던전</title>
<style>
:root{--bg:#0b0d14;--panel:#151925;--text:#f5f7ff;--muted:#9ea7bd;--gold:#f6c453;--hp:#d84f5f;--mp:#4d87ff;--good:#5fd3a3}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#1d2436,#0b0d14 65%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:14px}
.wrap{width:min(980px,100%)}
.head{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:10px}
h1{margin:0;font-size:clamp(24px,4vw,38px)}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#171c29;border:1px solid #2a3040;border-radius:12px;padding:8px 12px;font-size:14px}
.board{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:12px}
.gamebox{background:#0e121c;border:1px solid #2a3040;border-radius:18px;padding:10px}
canvas{width:100%;height:auto;display:block;border-radius:12px;background:#111827;touch-action:none}
.side{background:#131722;border:1px solid #2a3040;border-radius:18px;padding:14px}
.bar{height:14px;background:#242b3a;border-radius:999px;overflow:hidden;margin:6px 0 10px}
.fill{height:100%}
.hp{background:linear-gradient(90deg,#a9283d,#e86672)}
.mp{background:linear-gradient(90deg,#315fb8,#5e93ff)}
.row{display:flex;justify-content:space-between;font-size:13px;color:#cbd2e3}
.skill{border:1px solid #30384b;background:#1a2030;border-radius:12px;padding:10px;margin-top:9px}
.skill b{display:block}
.skill small{color:var(--muted)}
.log{margin-top:10px;background:#0e121c;border-radius:12px;padding:10px;min-height:86px;color:#cbd2e3;font-size:13px;line-height:1.45}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.controls button{min-height:48px;border:0;border-radius:12px;background:#222a3d;color:white;font-weight:700;font-size:16px}
.controls .empty{visibility:hidden}
.skillBtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.skillBtns button{min-height:48px;border:0;border-radius:12px;background:#2b3348;color:white;font-weight:700}
.skillBtns button.attack{background:#6c4f1d}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,7,12,.72);border-radius:12px}
.canvaswrap{position:relative}
.card{width:min(420px,90%);background:#161c2a;border:1px solid #344056;border-radius:18px;padding:22px;text-align:center}
.card h2{margin:0 0 8px;font-size:28px}.card p{color:#cbd2e3;line-height:1.5}
.card button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--gold);font-weight:800;font-size:17px}
@media(max-width:820px){.board{grid-template-columns:1fr}.side{order:2}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>⚔️ 별찌의 던전</h1><div class="sub">몹을 잡고 보스를 처치하라 — 미니 액션 RPG</div></div>
    <div class="stats">
      <div class="chip">처치 <b id="kills">0</b></div>
      <div class="chip">레벨 <b id="level">1</b></div>
      <div class="chip">점수 <b id="score">0</b></div>
    </div>
  </div>
  <div class="board">
    <div class="gamebox">
      <div class="canvaswrap">
        <canvas id="game" width="720" height="480"></canvas>
        <div id="overlay" class="overlay">
          <div class="card">
            <h2>별찌 출격</h2>
            <p>WASD / 방향키로 이동<br>Space 평타 · 1 돌진 · 2 회전베기 · 3 회복</p>
            <p>일반 몹 12마리를 잡으면 보스가 등장합니다.</p>
            <button id="startBtn">게임 시작</button>
          </div>
        </div>
      </div>
      <div class="controls">
        <div class="empty"></div><button data-key="ArrowUp">▲</button><div class="empty"></div>
        <button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button>
      </div>
      <div class="skillBtns">
        <button class="attack" data-action="attack">⚔ 평타</button>
        <button data-action="dash">1 돌진</button>
        <button data-action="spin">2 회전</button>
        <button data-action="heal">3 회복</button>
      </div>
    </div>
    <aside class="side">
      <div class="row"><span>체력</span><span id="hpTxt">100 / 100</span></div>
      <div class="bar"><div id="hpBar" class="fill hp" style="width:100%"></div></div>
      <div class="row"><span>마나</span><span id="mpTxt">100 / 100</span></div>
      <div class="bar"><div id="mpBar" class="fill mp" style="width:100%"></div></div>
      <div class="skill"><b>⚔ 평타 <span id="atkCd"></span></b><small>짧은 범위 기본 공격</small></div>
      <div class="skill"><b>1 · 돌진 <span id="dashCd"></span></b><small>전방으로 빠르게 돌진하며 피해</small></div>
      <div class="skill"><b>2 · 회전베기 <span id="spinCd"></span></b><small>주변 모든 적에게 강한 피해</small></div>
      <div class="skill"><b>3 · 회복 <span id="healCd"></span></b><small>마나 35 소모, 체력 회복</small></div>
      <div class="log" id="log">준비 완료.</div>
    </aside>
  </div>
</div>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d');
const overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn');
const killsEl=document.getElementById('kills'),levelEl=document.getElementById('level'),scoreEl=document.getElementById('score');
const hpBar=document.getElementById('hpBar'),mpBar=document.getElementById('mpBar'),hpTxt=document.getElementById('hpTxt'),mpTxt=document.getElementById('mpTxt');
const logEl=document.getElementById('log');
const cdEls={attack:document.getElementById('atkCd'),dash:document.getElementById('dashCd'),spin:document.getElementById('spinCd'),heal:document.getElementById('healCd')};
const keys={};
let running=false,last=0,spawnT=0,bossSpawned=false,kills=0,score=0,level=1;
let player,enemies=[],fx=[];
const cds={attack:0,dash:0,spin:0,heal:0};

function reset(){
 player={x:360,y:240,r:16,hp:100,maxHp:100,mp:100,maxMp:100,speed:170,dirX:1,dirY:0,inv:0};
 enemies=[];fx=[];spawnT=0;bossSpawned=false;kills=0;score=0;level=1;
 Object.keys(cds).forEach(k=>cds[k]=0);
 updateUI(); log('던전에 입장했다.');
}
function log(t){logEl.textContent=t}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function spawnEnemy(boss=false){
 const edge=Math.floor(Math.random()*4); let x,y;
 if(edge===0){x=Math.random()*c.width;y=-25}
 if(edge===1){x=c.width+25;y=Math.random()*c.height}
 if(edge===2){x=Math.random()*c.width;y=c.height+25}
 if(edge===3){x=-25;y=Math.random()*c.height}
 enemies.push({x,y,r:boss?30:14,hp:boss?420:45,maxHp:boss?420:45,speed:boss?58:75+Math.random()*20,damage:boss?22:10,boss,hitCd:0});
 if(boss) log('☠️ 보스: 공허의 학살자 등장!');
}
function updateUI(){
 killsEl.textContent=kills;levelEl.textContent=level;scoreEl.textContent=score;
 hpTxt.textContent=Math.max(0,Math.ceil(player?.hp||0))+' / '+(player?.maxHp||100);
 mpTxt.textContent=Math.ceil(player?.mp||0)+' / '+(player?.maxMp||100);
 hpBar.style.width=Math.max(0,(player?.hp||0)/(player?.maxHp||100)*100)+'%';
 mpBar.style.width=Math.max(0,(player?.mp||0)/(player?.maxMp||100)*100)+'%';
 for(const k in cds) cdEls[k].textContent=cds[k]>0?'('+cds[k].toFixed(1)+'s)':'';
}
function damageEnemy(e,dmg){
 e.hp-=dmg;
 fx.push({x:e.x,y:e.y,t:.28,text:'-'+Math.round(dmg),color:'#ffd166'});
 if(e.hp<=0){
   if(e.boss){score+=1000; end(true); return;}
   kills++;score+=100;
   if(kills%4===0){level++;player.maxHp+=15;player.hp=Math.min(player.maxHp,player.hp+25);player.maxMp+=10;player.mp=player.maxMp;log('✨ 레벨 업! 능력치가 상승했다.');}
 }
}
function cleanup(){enemies=enemies.filter(e=>e.hp>0)}
function attack(){
 if(!running||cds.attack>0)return;
 cds.attack=.38;
 for(const e of enemies){
   const dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy);
   if(d<58 && (dx*player.dirX+dy*player.dirY)>-10) damageEnemy(e,22+level*2);
 }
 fx.push({x:player.x+player.dirX*30,y:player.y+player.dirY*30,t:.14,ring:true,r:34});
 cleanup();
}
function dash(){
 if(!running||cds.dash>0)return;
 cds.dash=3;
 const oldX=player.x,oldY=player.y;
 player.x=Math.max(18,Math.min(c.width-18,player.x+player.dirX*100));
 player.y=Math.max(18,Math.min(c.height-18,player.y+player.dirY*100));
 for(const e of enemies){
   const ax=e.x-oldX,ay=e.y-oldY,bx=player.x-oldX,by=player.y-oldY;
   const len2=bx*bx+by*by||1,t=Math.max(0,Math.min(1,(ax*bx+ay*by)/len2));
   const px=oldX+bx*t,py=oldY+by*t;
   if(Math.hypot(e.x-px,e.y-py)<e.r+20)damageEnemy(e,38+level*3);
 }
 fx.push({x:player.x,y:player.y,t:.22,ring:true,r:45});cleanup();
}
function spin(){
 if(!running||cds.spin>0)return;
 cds.spin=5;
 for(const e of enemies)if(dist(player,e)<95)damageEnemy(e,55+level*4);
 fx.push({x:player.x,y:player.y,t:.35,ring:true,r:92});cleanup();
}
function heal(){
 if(!running||cds.heal>0||player.mp<35)return;
 cds.heal=8;player.mp-=35;player.hp=Math.min(player.maxHp,player.hp+45+level*4);
 fx.push({x:player.x,y:player.y,t:.6,text:'+회복',color:'#74e6b5'});log('💚 체력을 회복했다.');
}
function action(a){({attack,dash,spin,heal}[a]||(()=>{}))()}
function end(win=false){
 running=false;
 overlay.style.display='flex';
 overlay.querySelector('.card').innerHTML='<h2>'+(win?'🏆 던전 클리어!':'💀 별찌 전멸')+'</h2><p>점수 <b>'+score+'</b><br>처치 <b>'+kills+'</b><br>레벨 <b>'+level+'</b></p><button id="again">다시 도전</button>';
 document.getElementById('again').addEventListener('click',start);
}
function start(){reset();overlay.style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)}
function loop(now){
 if(!running)return;
 const dt=Math.min(.033,(now-last)/1000);last=now;
 update(dt);draw();requestAnimationFrame(loop);
}
function update(dt){
 let dx=0,dy=0;
 if(keys.ArrowLeft||keys.a||keys.A)dx--;if(keys.ArrowRight||keys.d||keys.D)dx++;
 if(keys.ArrowUp||keys.w||keys.W)dy--;if(keys.ArrowDown||keys.s||keys.S)dy++;
 if(dx||dy){const l=Math.hypot(dx,dy);dx/=l;dy/=l;player.dirX=dx;player.dirY=dy;player.x+=dx*player.speed*dt;player.y+=dy*player.speed*dt}
 player.x=Math.max(18,Math.min(c.width-18,player.x));player.y=Math.max(18,Math.min(c.height-18,player.y));
 player.mp=Math.min(player.maxMp,player.mp+8*dt);player.inv=Math.max(0,player.inv-dt);
 for(const k in cds)cds[k]=Math.max(0,cds[k]-dt);
 spawnT+=dt;
 if(!bossSpawned&&kills>=12){bossSpawned=true;spawnEnemy(true)}
 if(!bossSpawned&&spawnT>1.2){spawnT=0;spawnEnemy(false)}
 for(const e of enemies){
   const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;
   e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;e.hitCd=Math.max(0,e.hitCd-dt);
   if(d<player.r+e.r+2 && e.hitCd<=0 && player.inv<=0){
     player.hp-=e.damage;e.hitCd=.8;player.inv=.35;fx.push({x:player.x,y:player.y,t:.3,text:'-'+e.damage,color:'#ff6b7a'});
     if(player.hp<=0){end(false);return}
   }
 }
 for(const f of fx)f.t-=dt;fx=fx.filter(f=>f.t>0);updateUI();
}
function draw(){
 ctx.clearRect(0,0,c.width,c.height);
 ctx.fillStyle='#0f1723';ctx.fillRect(0,0,c.width,c.height);
 ctx.strokeStyle='#1f2a3a';ctx.lineWidth=1;
 for(let x=0;x<c.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.height);ctx.stroke()}
 for(let y=0;y<c.height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke()}
 for(const e of enemies){
   ctx.beginPath();ctx.fillStyle=e.boss?'#7d2a86':'#8a3442';ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#252b37';ctx.fillRect(e.x-e.r,e.y-e.r-10,e.r*2,5);
   ctx.fillStyle=e.boss?'#d84ee6':'#e86672';ctx.fillRect(e.x-e.r,e.y-e.r-10,e.r*2*(e.hp/e.maxHp),5);
   ctx.fillStyle='#fff';ctx.font=e.boss?'22px sans-serif':'15px sans-serif';ctx.textAlign='center';ctx.fillText(e.boss?'☠':'👹',e.x,e.y+6);
 }
 ctx.beginPath();ctx.fillStyle=player.inv>0?'#fff2a8':'#f2c94c';ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#141414';ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText('⭐',player.x,player.y+6);
 ctx.strokeStyle='#f6c453';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(player.x+player.dirX*26,player.y+player.dirY*26);ctx.stroke();
 for(const f of fx){
   if(f.ring){ctx.strokeStyle='rgba(246,196,83,'+Math.min(1,f.t*3)+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1.1-f.t*.5),0,Math.PI*2);ctx.stroke()}
   if(f.text){ctx.fillStyle=f.color;ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y-20)}
 }
}
document.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','1','2','3','w','a','s','d','W','A','S','D'].includes(e.key))e.preventDefault();
 keys[e.key]=true;if(e.key===' ')attack();if(e.key==='1')dash();if(e.key==='2')spin();if(e.key==='3')heal();
},{passive:false});
document.addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));
startBtn.addEventListener('click',start);
reset();draw();
})();
</script>
</body>
</html>
