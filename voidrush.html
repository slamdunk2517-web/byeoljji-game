<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>별찌: VOID RUSH</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#18233d,#090d17 45%,#05070c);color:#f7f9ff}body{padding:12px}.wrap{width:min(1180px,100%);margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}h1{margin:0;font-size:clamp(28px,4vw,46px)}h1 span{color:#73e6ff}.sub{color:#8e9ab2;font-size:13px;margin-top:5px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{min-width:82px;padding:9px 11px;text-align:center;background:#0d1422;border:1px solid #25344e;border-radius:12px}.stat small{display:block;color:#8e9ab2;font-size:10px}.stat b{font-size:19px}.frame{background:#0a101a;border:1px solid #26354f;border-radius:20px;padding:9px}.stage{position:relative;overflow:hidden;border-radius:14px}canvas{display:block;width:100%;height:auto;background:#060a12;touch-action:none}.hud{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.box{background:rgba(5,9,16,.75);border:1px solid rgba(130,170,220,.23);border-radius:11px;padding:8px 10px;min-width:180px;backdrop-filter:blur(5px)}.row{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:#a7b3c8}.bar{height:8px;background:#172236;border-radius:99px;overflow:hidden;margin:5px 0}.fill{height:100%}.hp{background:linear-gradient(90deg,#ff607a,#ff8b9b)}.xp{background:linear-gradient(90deg,#748cff,#72e7ff)}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(3,6,11,.68);backdrop-filter:blur(6px)}.panel{width:min(580px,94%);padding:22px;text-align:center;background:linear-gradient(180deg,#121c2d,#090f1a);border:1px solid #304361;border-radius:20px}.panel h2{margin:0 0 8px;font-size:30px}.panel p{color:#acb9ce;line-height:1.55;font-size:14px}.start{width:100%;padding:14px;border:0;border-radius:13px;background:linear-gradient(180deg,#91f2ff,#58cce8);color:#07121a;font-weight:900;font-size:16px;cursor:pointer}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.choice{padding:14px;text-align:left;color:#fff;background:#101a2b;border:1px solid #2d4160;border-radius:13px;cursor:pointer}.choice b{display:block;margin-bottom:6px}.choice small{color:#9eabc0;line-height:1.4}.boss{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(520px,72%);display:none;background:rgba(5,9,16,.82);border:1px solid rgba(255,100,125,.38);border-radius:11px;padding:8px 10px}.mobile{display:none;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:9px}.mobile button{min-height:50px;border:1px solid #304361;border-radius:12px;background:#111b2c;color:#fff;font-size:18px;font-weight:900;touch-action:none}.mobile .dash{grid-column:1/4;background:#1a2944}@media(max-width:850px){.mobile{display:grid}.choices{grid-template-columns:1fr}.box{min-width:145px}}
</style></head>
<body><div class="wrap">
<div class="top"><div><h1>별찌: <span>VOID RUSH</span></h1><div class="sub">네온 아레나 로그라이크 · 자동사격 · 레벨업 · 보스전</div></div><div class="stats"><div class="stat"><small>LEVEL</small><b id="lvl">1</b></div><div class="stat"><small>KILLS</small><b id="kills">0</b></div><div class="stat"><small>SCORE</small><b id="score">0</b></div><div class="stat"><small>BEST</small><b id="best">0</b></div></div></div>
<div class="frame"><div class="stage"><canvas id="game" width="1100" height="650"></canvas>
<div class="hud"><div class="box"><div class="row"><span>HP</span><b id="hpText">100 / 100</b></div><div class="bar"><div id="hpBar" class="fill hp" style="width:100%"></div></div><div class="row"><span>XP</span><b id="xpText">0 / 40</b></div><div class="bar"><div id="xpBar" class="fill xp"></div></div></div><div class="box" style="text-align:right"><small style="color:#8e9ab2">WAVE</small><div style="font-weight:900;font-size:19px" id="wave">1 / 5</div><small id="hostiles" style="color:#8e9ab2">0 HOSTILES</small></div></div>
<div class="boss" id="bossBox"><div class="row"><span>VOID TITAN</span><b id="bossPct">100%</b></div><div class="bar"><div id="bossBar" class="fill hp"></div></div></div>
<div class="overlay" id="overlay"><div class="panel" id="panel"><h2>VOID RUSH</h2><p>WASD / 방향키로 이동. 가장 가까운 적에게 자동 사격한다.<br>Space로 대시. 경험치를 모으면 강화 3개 중 하나를 선택.</p><p>5번째 웨이브의 <b>VOID TITAN</b>을 처치하면 클리어.</p><button class="start" id="startBtn">RUN START</button></div></div>
</div><div class="mobile"><button id="left">◀</button><button id="up">▲</button><button id="right">▶</button><button id="down" style="grid-column:2">▼</button><button id="dash" class="dash">⚡ DASH</button></div></div></div>
<script>
(function(){
"use strict";
const c=document.getElementById("game"),ctx=c.getContext("2d"),W=c.width,H=c.height;
const overlay=document.getElementById("overlay"),panel=document.getElementById("panel");
const hpBar=document.getElementById("hpBar"),xpBar=document.getElementById("xpBar"),hpText=document.getElementById("hpText"),xpText=document.getElementById("xpText");
const lvlEl=document.getElementById("lvl"),killsEl=document.getElementById("kills"),scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),waveEl=document.getElementById("wave"),hostilesEl=document.getElementById("hostiles");
const bossBox=document.getElementById("bossBox"),bossBar=document.getElementById("bossBar"),bossPct=document.getElementById("bossPct");
let best=Number(localStorage.getItem("voidrush-best")||0);bestEl.textContent=best;
let running=false,paused=false,last=0,t=0,wave=1,waveKills=0,kills=0,score=0,spawnTimer=0,nextWaveTimer=0;
let enemies=[],bullets=[],gems=[],parts=[],boss=null;
let keys={};
let p=null;
let build={damage:0,rate:0,speed:0,multishot:0,pierce:0,crit:0,maxhp:0};

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function rand(a,b){return Math.random()*(b-a)+a}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function reset(){
 wave=1;waveKills=0;kills=0;score=0;t=0;spawnTimer=0;nextWaveTimer=0;
 enemies=[];bullets=[];gems=[];parts=[];boss=null;
 build={damage:0,rate:0,speed:0,multishot:0,pierce:0,crit:0,maxhp:0};
 p={x:W/2,y:H/2,r:16,hp:100,maxHp:100,xp:0,nextXp:40,level:1,speed:245,fire:0,dashCd:0,dashT:0,dx:1,dy:0,inv:0};
 updateUI();
}
function updateUI(){
 hpBar.style.width=clamp(p.hp/p.maxHp*100,0,100)+"%"; hpText.textContent=Math.ceil(Math.max(0,p.hp))+" / "+p.maxHp;
 xpBar.style.width=clamp(p.xp/p.nextXp*100,0,100)+"%"; xpText.textContent=Math.floor(p.xp)+" / "+p.nextXp;
 lvlEl.textContent=p.level;killsEl.textContent=kills;scoreEl.textContent=Math.floor(score);bestEl.textContent=best;
 waveEl.textContent=wave+" / 5";hostilesEl.textContent=enemies.length+" HOSTILES";
 if(boss&&boss.alive){bossBox.style.display="block";const q=clamp(boss.hp/boss.maxHp*100,0,100);bossBar.style.width=q+"%";bossPct.textContent=Math.ceil(q)+"%"}else bossBox.style.display="none";
}
function spawnEnemy(){
 const edge=Math.floor(Math.random()*4);let x=0,y=0;
 if(edge===0){x=rand(0,W);y=-30}else if(edge===1){x=W+30;y=rand(0,H)}else if(edge===2){x=rand(0,W);y=H+30}else{x=-30;y=rand(0,H)}
 const r=Math.random(),scale=1+(wave-1)*.16;
 let e;
 if(r<.58)e={x,y,r:13,hp:34*scale,speed:82+wave*6,dmg:12,color:"#ff6683",xp:9};
 else if(r<.83)e={x,y,r:10,hp:22*scale,speed:135+wave*8,dmg:10,color:"#ffae69",xp:8};
 else e={x,y,r:21,hp:95*scale,speed:54+wave*4,dmg:20,color:"#ad7dff",xp:16};
 enemies.push(e);
}
function spawnBoss(){boss={x:W/2,y:90,r:50,hp:1600,maxHp:1600,speed:48,dmg:25,alive:true,shot:1.4,phase:0}}
function nearest(){
 let target=null,d=Infinity;
 for(const e of enemies){const n=(e.x-p.x)**2+(e.y-p.y)**2;if(n<d){d=n;target=e}}
 if(boss&&boss.alive){const n=(boss.x-p.x)**2+(boss.y-p.y)**2;if(n<d)target=boss}
 return target;
}
function shoot(){
 const q=nearest();if(!q)return;
 const a=Math.atan2(q.y-p.y,q.x-p.x),count=1+Math.min(3,build.multishot);
 for(let i=0;i<count;i++){const ang=a+(i-(count-1)/2)*.14;bullets.push({x:p.x,y:p.y,vx:Math.cos(ang)*590,vy:Math.sin(ang)*590,r:4,life:1.5,dmg:21*(1+build.damage*.22),pierce:build.pierce,crit:Math.random()<Math.min(.5,build.crit*.1),enemy:false})}
}
function particles(x,y,color,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rand(-180,180),vy:rand(-180,180),a:1,r:rand(1.5,4),color})}
function killEnemy(e){
 const i=enemies.indexOf(e);if(i<0)return;
 enemies.splice(i,1);kills++;waveKills++;score+=100;gems.push({x:e.x,y:e.y,r:5,xp:e.xp});particles(e.x,e.y,e.color,12);
}
function hurt(n){if(p.inv>0||p.dashT>0)return;p.hp-=n;p.inv=.65;particles(p.x,p.y,"#ff6680",18);if(p.hp<=0){gameOver()}updateUI()}
function gainXp(n){
 p.xp+=n;
 if(p.xp>=p.nextXp){p.xp-=p.nextXp;p.level++;p.nextXp=Math.floor(p.nextXp*1.28+10);levelUp()}
}
const choices=[
 ["OVERDRIVE","+22% 피해",()=>build.damage++],
 ["RAPID CORE","연사속도 +18%",()=>build.rate++],
 ["PHASE STEP","이동속도 +10%",()=>build.speed++],
 ["MULTI SHOT","추가 탄환 +1",()=>build.multishot++],
 ["VOID NEEDLE","관통 +1",()=>build.pierce++],
 ["CRIT MATRIX","치명타 +10%",()=>build.crit++],
 ["REINFORCED","+25 최대 체력",()=>{build.maxhp++;p.maxHp+=25;p.hp=Math.min(p.maxHp,p.hp+25)}]
];
function levelUp(){
 paused=true;
 const arr=[...choices].sort(()=>Math.random()-.5).slice(0,3);
 panel.innerHTML='<h2>LEVEL '+p.level+'</h2><p>강화 하나를 선택하세요.</p><div class="choices" id="choiceBox"></div>';
 const box=document.getElementById("choiceBox");
 arr.forEach(u=>{const b=document.createElement("button");b.className="choice";b.innerHTML="<b>"+u[0]+"</b><small>"+u[1]+"</small>";b.addEventListener("click",()=>{u[2]();overlay.style.display="none";paused=false;last=performance.now();updateUI();requestAnimationFrame(loop)});box.appendChild(b)});
 overlay.style.display="flex";
}
function dash(){
 if(!running||paused||p.dashCd>0)return;
 let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);
 let m=Math.hypot(dx,dy);if(!m){dx=1;dy=0;m=1}
 p.dx=dx/m;p.dy=dy/m;p.dashT=.2;p.dashCd=1.7;p.inv=.25;particles(p.x,p.y,"#73e6ff",12);
}
function gameOver(){
 running=false;if(score>best){best=Math.floor(score);localStorage.setItem("voidrush-best",best)}
 updateUI();panel.innerHTML='<h2>CORE LOST</h2><p>WAVE '+wave+' · KILLS '+kills+' · LEVEL '+p.level+'</p><p>점수 <b>'+Math.floor(score)+'</b></p><button class="start" id="retry">REBOOT</button>';overlay.style.display="flex";document.getElementById("retry").addEventListener("click",start)
}
function finish(){
 running=false;if(score>best){best=Math.floor(score);localStorage.setItem("voidrush-best",best)}
 updateUI();panel.innerHTML='<h2>RUN COMPLETE</h2><p>VOID TITAN 처치 완료.</p><p>KILLS '+kills+' · LEVEL '+p.level+'<br>점수 <b>'+Math.floor(score)+'</b></p><button class="start" id="retry">NEW RUN</button>';overlay.style.display="flex";document.getElementById("retry").addEventListener("click",start)
}
function update(dt){
 t+=dt;p.inv=Math.max(0,p.inv-dt);p.dashCd=Math.max(0,p.dashCd-dt);p.dashT=Math.max(0,p.dashT-dt);
 let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);let m=Math.hypot(dx,dy);if(m){dx/=m;dy/=m}
 const speed=p.speed*(1+build.speed*.1);
 if(p.dashT>0){p.x+=p.dx*680*dt;p.y+=p.dy*680*dt}else{p.x+=dx*speed*dt;p.y+=dy*speed*dt}
 p.x=clamp(p.x,25,W-25);p.y=clamp(p.y,25,H-25);
 p.fire-=dt;if(p.fire<=0){shoot();p.fire=Math.max(.1,.42*Math.pow(.82,build.rate))}
 if(wave<5){
   spawnTimer+=dt;const need=10+wave*6;
   if(waveKills<need&&spawnTimer>Math.max(.25,.72-wave*.07)&&enemies.length<7+wave*2){spawnTimer=0;spawnEnemy()}
   if(waveKills>=need&&enemies.length===0){nextWaveTimer+=dt;if(nextWaveTimer>1){wave++;waveKills=0;nextWaveTimer=0;if(wave===5)spawnBoss()}}
 }
 for(const e of enemies){const a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;if(distance(p,e)<p.r+e.r)hurt(e.dmg)}
 if(boss&&boss.alive){
   const a=Math.atan2(p.y-boss.y,p.x-boss.x);boss.x+=Math.cos(a)*boss.speed*dt;boss.y+=Math.sin(a)*boss.speed*dt;
   boss.shot-=dt;if(boss.shot<=0){boss.shot=Math.max(.55,1.4-boss.phase*.13);const n=8+boss.phase*2;for(let i=0;i<n;i++){const an=i/n*Math.PI*2+t*.25;bullets.push({x:boss.x,y:boss.y,vx:Math.cos(an)*(180+boss.phase*25),vy:Math.sin(an)*(180+boss.phase*25),r:6,life:3,dmg:12,enemy:true})}boss.phase=Math.min(3,boss.phase+1)}
   if(distance(p,boss)<p.r+boss.r)hurt(boss.dmg)
 }
 for(let i=bullets.length-1;i>=0;i--){
   const b=bullets[i];b.life-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
   if(b.enemy){
     if(distance(p,b)<p.r+b.r){hurt(b.dmg);bullets.splice(i,1);continue}
   }else{
     let hit=null;
     if(boss&&boss.alive&&distance(b,boss)<b.r+boss.r)hit=boss;
     if(!hit){for(const e of enemies){if(distance(b,e)<b.r+e.r){hit=e;break}}}
     if(hit){
       const dmg=b.dmg*(b.crit?2:1);hit.hp-=dmg;score+=dmg;particles(b.x,b.y,b.crit?"#ffd56a":"#73e6ff",b.crit?7:3);
       if(hit===boss&&hit.hp<=0){boss.alive=false;score+=3000;particles(boss.x,boss.y,"#ff7d9c",50);setTimeout(finish,500)}
       else if(hit!==boss&&hit.hp<=0)killEnemy(hit);
       if((b.pierce||0)>0)b.pierce--;else{bullets.splice(i,1);continue}
     }
   }
   if(b.life<=0||b.x<-60||b.x>W+60||b.y<-60||b.y>H+60)bullets.splice(i,1)
 }
 for(let i=gems.length-1;i>=0;i--){const g=gems[i],d=distance(p,g);if(d<160){const a=Math.atan2(p.y-g.y,p.x-g.x);g.x+=Math.cos(a)*(220+(160-d)*3)*dt;g.y+=Math.sin(a)*(220+(160-d)*3)*dt}if(distance(p,g)<p.r+g.r+4){gainXp(g.xp);gems.splice(i,1)}}
 for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;q.a-=dt*2}parts=parts.filter(q=>q.a>0);
 score+=dt*4;updateUI();
}
function draw(){
 ctx.fillStyle="#060a12";ctx.fillRect(0,0,W,H);
 const glow=ctx.createRadialGradient(p.x,p.y,10,p.x,p.y,500);glow.addColorStop(0,"rgba(30,75,115,.34)");glow.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle="rgba(90,140,190,.09)";ctx.lineWidth=1;for(let x=(t*7)%44-44;x<W;x+=44){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=(t*5)%44-44;y<H;y+=44){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(const g of gems){ctx.save();ctx.shadowColor="#73e6ff";ctx.shadowBlur=12;ctx.fillStyle="#73e6ff";ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();ctx.restore()}
 for(const e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.shadowColor=e.color;ctx.shadowBlur=16;ctx.fillStyle="#09101b";ctx.strokeStyle=e.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();ctx.restore()}
 if(boss&&boss.alive){ctx.save();ctx.translate(boss.x,boss.y);ctx.rotate(t*.3);ctx.shadowColor="#ff6781";ctx.shadowBlur=34;ctx.strokeStyle="#ff6781";ctx.fillStyle="#160e18";ctx.lineWidth=5;ctx.beginPath();for(let i=0;i<10;i++){const a=i/10*Math.PI*2,r=i%2?30:boss.r;i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
 for(const b of bullets){ctx.save();ctx.shadowColor=b.enemy?"#ff667e":b.crit?"#ffd56a":"#73e6ff";ctx.shadowBlur=16;ctx.fillStyle=ctx.shadowColor;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.restore()}
 for(const q of parts){ctx.globalAlpha=q.a;ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 ctx.save();ctx.translate(p.x,p.y);if(p.inv>0&&Math.floor(p.inv*15)%2===0)ctx.globalAlpha=.4;ctx.shadowColor="#73e6ff";ctx.shadowBlur=26;ctx.fillStyle="#d9fbff";ctx.beginPath();for(let i=0;i<8;i++){const a=i/8*Math.PI*2-Math.PI/2,r=i%2?8:18;i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.fillStyle="#58dffb";ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill();ctx.restore();ctx.globalAlpha=1;
}
function loop(now){if(!running||paused)return;const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();if(running&&!paused)requestAnimationFrame(loop)}
function start(){reset();overlay.style.display="none";running=true;paused=false;last=performance.now();requestAnimationFrame(loop)}
document.getElementById("startBtn").addEventListener("click",start);
document.addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," ","w","a","s","d","W","A","S","D"].includes(e.key))e.preventDefault();if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")keys.left=true;if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")keys.right=true;if(e.key==="ArrowUp"||e.key==="w"||e.key==="W")keys.up=true;if(e.key==="ArrowDown"||e.key==="s"||e.key==="S")keys.down=true;if(e.key===" ")dash()},{passive:false});
document.addEventListener("keyup",e=>{if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A")keys.left=false;if(e.key==="ArrowRight"||e.key==="d"||e.key==="D")keys.right=false;if(e.key==="ArrowUp"||e.key==="w"||e.key==="W")keys.up=false;if(e.key==="ArrowDown"||e.key==="s"||e.key==="S")keys.down=false});
function hold(id,key){const el=document.getElementById(id);el.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true});["pointerup","pointercancel","pointerleave"].forEach(ev=>el.addEventListener(ev,()=>keys[key]=false))}
hold("left","left");hold("right","right");hold("up","up");hold("down","down");document.getElementById("dash").addEventListener("click",dash);
reset();draw();
})();
</script></body></html>
