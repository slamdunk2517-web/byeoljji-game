<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>별찌 똥 피하기</title>
<style>
:root{--bg:#19130f;--panel:#2a2119;--text:#fff7e8;--muted:#cbbda9;--gold:#ffd166;--bad:#7a4d22;--good:#75d69c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#3b2c20,#19130f 65%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:14px}
.wrap{width:min(860px,100%)}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:10px}
h1{margin:0;font-size:clamp(24px,4vw,38px)}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#2a2119;border:1px solid #493827;border-radius:12px;padding:8px 12px;font-size:14px}
.gamebox{background:#241b15;border:1px solid #493827;border-radius:18px;padding:10px}
.canvaswrap{position:relative}
canvas{width:100%;height:auto;display:block;border-radius:12px;background:#8fd3ff;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,20,14,.68);border-radius:12px;padding:20px}
.card{width:min(420px,92%);background:#2c2118;border:1px solid #59432f;border-radius:18px;padding:22px;text-align:center}
.card h2{margin:0 0 8px;font-size:28px}.card p{color:#e0d3c0;line-height:1.5}
.card button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--gold);font-weight:800;font-size:17px}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;max-width:320px;margin:12px auto 0}
.controls button{min-height:50px;border:0;border-radius:12px;background:#493827;color:#fff;font-weight:800;font-size:18px}
.controls .empty{visibility:hidden}
.note{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>💩 별찌 똥 피하기</h1>
      <div class="sub">떨어지는 똥은 피하고, 좋은 아이템은 먹어라.</div>
    </div>
    <div class="stats">
      <div class="chip">점수 <b id="score">0</b></div>
      <div class="chip">목숨 <b id="life">3</b></div>
      <div class="chip">최고 <b id="best">0</b></div>
    </div>
  </div>

  <div class="gamebox">
    <div class="canvaswrap">
      <canvas id="game" width="760" height="500"></canvas>
      <div id="overlay" class="overlay">
        <div class="card">
          <h2>별찌 비상사태</h2>
          <p>💩 똥을 피하세요.<br>🧻 휴지 · 🧼 비누 · 🍗 치킨을 먹으면 보너스!</p>
          <p><b>PC:</b> ← → 또는 A / D<br><b>모바일:</b> 아래 버튼</p>
          <button id="startBtn">게임 시작</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="empty"></div><button id="jumpBtn">점프</button><div class="empty"></div>
      <button id="leftBtn">◀</button><button id="downBtn">숙이기</button><button id="rightBtn">▶</button>
    </div>
    <div class="note">시간이 지날수록 똥이 더 빨리, 더 자주 떨어집니다.</div>
  </div>
</div>

<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d');
const overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn');
const scoreEl=document.getElementById('score'),lifeEl=document.getElementById('life'),bestEl=document.getElementById('best');
const leftBtn=document.getElementById('leftBtn'),rightBtn=document.getElementById('rightBtn'),jumpBtn=document.getElementById('jumpBtn'),downBtn=document.getElementById('downBtn');

let best=Number(localStorage.getItem('byeoljji-poop-best')||0);bestEl.textContent=best;
let running=false,last=0,spawnT=0,goodT=0,score=0,life=3,time=0;
let player={x:380,y:435,w:46,h:54,vx:0,vy:0,onGround:true,duck:false,inv:0};
let objs=[],keys={};

function reset(){
 score=0;life=3;time=0;spawnT=0;goodT=0;objs=[];
 player={x:380,y:435,w:46,h:54,vx:0,vy:0,onGround:true,duck:false,inv:0};
 updateUI();
}
function updateUI(){scoreEl.textContent=Math.floor(score);lifeEl.textContent=life;bestEl.textContent=best}
function start(){reset();overlay.style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)}
function spawn(type){
 const isGood=type==='good';
 const goodIcons=['🧻','🧼','🍗'];
 const x=25+Math.random()*(c.width-50);
 const speed=(isGood?120:150)+Math.random()*80+Math.min(180,time*4);
 objs.push({x,y:-40,r:isGood?18:22,speed,good:isGood,icon:isGood?goodIcons[Math.floor(Math.random()*goodIcons.length)]:'💩'});
}
function rectCircle(px,py,pw,ph,o){
 const cx=Math.max(px,Math.min(o.x,px+pw)),cy=Math.max(py,Math.min(o.y,py+ph));
 const dx=o.x-cx,dy=o.y-cy;return dx*dx+dy*dy<o.r*o.r;
}
function end(){
 running=false;
 if(score>best){best=Math.floor(score);localStorage.setItem('byeoljji-poop-best',best)}
 updateUI();
 overlay.style.display='flex';
 overlay.querySelector('.card').innerHTML='<h2>💥 별찌 대참사</h2><p>최종 점수 <b>'+Math.floor(score)+'</b><br>최고 점수 <b>'+best+'</b></p><button id="again">다시 도전</button>';
 document.getElementById('again').addEventListener('click',start);
}
function loop(now){
 if(!running)return;
 const dt=Math.min(.033,(now-last)/1000);last=now;time+=dt;
 update(dt);draw();requestAnimationFrame(loop);
}
function update(dt){
 let move=0;if(keys.left)move--;if(keys.right)move++;
 player.x+=move*260*dt;
 player.x=Math.max(8,Math.min(c.width-player.w-8,player.x));

 if(!player.onGround){player.vy+=780*dt;player.y+=player.vy*dt;if(player.y>=435){player.y=435;player.vy=0;player.onGround=true}}
 player.inv=Math.max(0,player.inv-dt);

 spawnT+=dt;goodT+=dt;
 const poopRate=Math.max(.22,.75-time*.008);
 if(spawnT>poopRate){spawnT=0;spawn('bad')}
 if(goodT>3.3){goodT=0;spawn('good')}

 const ph=player.duck?34:player.h;
 const py=player.duck?player.y+20:player.y;

 for(let i=objs.length-1;i>=0;i--){
   const o=objs[i];o.y+=o.speed*dt;
   if(rectCircle(player.x,py,player.w,ph,o)){
     if(o.good){score+=120;life=Math.min(5,life+1)}
     else if(player.inv<=0){life--;player.inv=1.0;score=Math.max(0,score-60)}
     objs.splice(i,1);
     if(life<=0){end();return}
     continue;
   }
   if(o.y>c.height+50){if(!o.good)score+=8;objs.splice(i,1)}
 }
 score+=dt*10;updateUI();
}
function draw(){
 ctx.clearRect(0,0,c.width,c.height);
 const g=ctx.createLinearGradient(0,0,0,c.height);g.addColorStop(0,'#8fd3ff');g.addColorStop(1,'#d7efff');ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height);
 ctx.fillStyle='#6e9c53';ctx.fillRect(0,458,c.width,42);
 ctx.fillStyle='#7f5b37';for(let i=0;i<c.width;i+=55)ctx.fillRect(i,470,28,8);

 for(const o of objs){ctx.font=(o.good?'30px':'36px')+' sans-serif';ctx.textAlign='center';ctx.fillText(o.icon,o.x,o.y)}
 const alpha=player.inv>0 && Math.floor(player.inv*10)%2===0?.35:1;ctx.globalAlpha=alpha;
 ctx.fillStyle='#ffd84d';ctx.beginPath();ctx.arc(player.x+23,player.y+18,18,0,Math.PI*2);ctx.fill();
 ctx.font='26px sans-serif';ctx.textAlign='center';ctx.fillText('⭐',player.x+23,player.y+25);
 ctx.fillStyle='#32466f';ctx.fillRect(player.x+8,player.y+34,30,player.duck?18:24);
 ctx.globalAlpha=1;
 ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(0,0,c.width,34);
 ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.textAlign='left';ctx.fillText('생존 '+time.toFixed(1)+'초',14,22);
}
function jump(){if(running&&player.onGround){player.onGround=false;player.vy=-360}}
function duck(v){player.duck=v}
document.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','d','A','D',' '].includes(e.key))e.preventDefault();
 if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;
 if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;
 if(e.key==='ArrowUp'||e.key===' ')jump();
 if(e.key==='ArrowDown')duck(true);
},{passive:false});
document.addEventListener('keyup',e=>{
 if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;
 if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false;
 if(e.key==='ArrowDown')duck(false);
});
function hold(btn,key){btn.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,()=>keys[key]=false))}
hold(leftBtn,'left');hold(rightBtn,'right');
jumpBtn.addEventListener('click',jump);
downBtn.addEventListener('pointerdown',()=>duck(true));['pointerup','pointercancel','pointerleave'].forEach(ev=>downBtn.addEventListener(ev,()=>duck(false)));
startBtn.addEventListener('click',start);
reset();draw();
})();
</script>
</body>
</html>
